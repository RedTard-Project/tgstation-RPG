author: "trueroguan"
delete-after: True
changes:
  - rscadd: "22 Vibelin races with faiths, patrons and cultures; Ratwood homelands with traits and prejudice"
  - rscadd: "Treasury: institution funds with JAWBANK machines, loans, poll tax, charters and crown bankruptcy"
  - rscadd: "Trade: quality-based prices, harbor ships, standing orders, bounties, lottery, black market and mail"
  - rscadd: "Ratwood bows, crossbows and slings with quivers; perception affects aim"
  - rscadd: "Combat-mode music, chosen in character setup"
  - rscadd: "Casting, pottery wheel, kiln firing, artificer table, soups and stews"
  - rscadd: "Books, bookcases, literacy and craft manuals"
  - rscadd: "Triumphs for surviving nights, round-end rewards and a triumph shop"
  - rscadd: "Ranged mobs, monster abilities, spider webs and nests"
  - rscadd: "Sleeves that tear and roll up; hoods and visors that raise"
  - rscadd: "Russian translation, chosen per player; racial speech fonts"
  - balance: "Mobs behind you are not drawn at all"
  - qol: "All TG game settings are in the character setup's Settings page"
  - qol: "Ratwood default hotkeys"
  - bugfix: "Entering an area with new music no longer freezes the client"
  - bugfix: "Held, back and hip sprites were drawn 16 pixels off"
  - bugfix: "The two back slots acted as one"
  - admin: "Ratwood GM tools (PQ, triumphs) under Rogue Systems"