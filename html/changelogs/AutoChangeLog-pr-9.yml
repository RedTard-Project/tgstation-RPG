author: "trueroguan"
delete-after: True
changes:
  - rscadd: "Medieval maps: every hit leaves an injury that bleeds, hurts, merges with similar ones, heals on its own (faster asleep) and can get infected on dirty ground."
  - rscadd: "Pain is tracked per body part and builds into eight stages of shock; the pulse drives bleeding."
  - rscadd: "Splints and tourniquets. Needles sew arteries first, then critical wounds, then injuries; a bandage holds until fresh blood soaks it."
  - rscadd: "Surgery rolls 3d20 against skill, tool, table and a mentor nearby; a failed step leaves an infected wound. New operations: wound treatment, facial reconstruction, wooden limb removal, prosthetic fitting."
  - rscadd: "Teeth can be knocked out, pulled and implanted; blows to a wounded head or torso can damage organs."
  - rscadd: "Vibelin food: 287 dishes, 32 vessels, 106 recipes."
  - rscadd: "Eight Arcyne sub-skills by spell form; mages get spellbook points by role; Arcyne Insight scrolls."
  - rscadd: "Blacksteel weapons have their Azure special attacks; the great flail sweeps in a ring; a stuck weapon can be shaken off with resist."
  - rscadd: "Symbols and idols for the Great Hunt and the Wurm."
  - rscadd: "Roguetown's frame around the game field, with plain darkness around it."
  - balance: "Critical wounds roll per wound type and happen more often; bleeding is weaker under armour that was not pierced."
  - balance: "Bows and slings scale with Perception as in Ratwood; weapon integrity follows Vibelin; a head crit knocks out for 30 seconds from any side; Great Swing of the White Stag costs 35."
  - balance: "Strong and swift stances cost stamina as in Azure Peak."
  - balance: "29 combat values corrected after checking 786 against Azure Peak."
  - balance: "Dirt slows movement; fourteen worthless items sell for 0 again."
  - qol: "Walking is the default pace on medieval maps; the view there is 15x15 whatever the widescreen preference says."
  - qol: "The left HUD column stands beside the field and no longer folds; hands, intents and the RMB button moved to a row under the field."
  - qol: "Alerts line up from the top left corner, buffs and debuffs keep the column under the gargoyle, and action buttons build in rows from the bottom edge next to the inventory."
  - qol: "The inventory opens neatly inside the frame; the heart has a backing square; the mana bar is violet and stands beside the stamina bars."
  - qol: "The chat uses the Mookmania face in both English and Russian."
  - bugfix: "Zone hotkeys select a single body part on the gargoyle and cycle through the zone, instead of the whole zone at once."
  - bugfix: "A blow to a limb at its damage cap can crit and dismember again instead of reading as stopped by armour."
  - bugfix: "A full heal clears pain and shock; a reattached limb no longer re-opens its critical wounds."
  - bugfix: "Bombard HE shells flash instead of setting eight tiles on fire; hand hotkeys work again after the upstream merge."
  - admin: "The Rogue Mechanics panel groups, filters and pages its values, so it opens quickly with thousands of them."
  - config: "More balance values are tunable (medicine, surgery, prices, spell ranges, anvil formulas) and follow live edits from the Rogue Mechanics panel."
  - config: "New server settings ROGUE_VIEW_RANGE, ROGUE_DUNGEON_IN_LOBBY and ROGUE_HUD_FRAME."
  - server: "The Rockhill dungeon is built during the lobby; its entrances open when it is ready."