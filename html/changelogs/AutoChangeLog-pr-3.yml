author: "trueroguan"
delete-after: True
changes:
  - rscadd: "Orcs, dark elves and goblins are playable, with racial bonuses, their own languages, voices and darkvision."
  - rscadd: "Migrant waves can join a running round on medieval maps."
  - rscadd: "Medieval main menu: animated title, handwritten welcome, ready-up bonus, patron queue; readying up needs flavor text and OOC notes."
  - rscadd: "Vibelin's character setup menu on medieval maps."
  - rscadd: "Coins, pouches, prices, the Crown's treasury, NERVELOCK accounts, the stockpile, the PEDDLER and the GOLDFACE merchants, the steward's nerve master."
  - rscadd: "Cooking on hearths, fires and ovens, table recipes, food rot, warmth and rest by fires, sleep healing and bedrolls."
  - rscadd: "Smelting, forging, repairs, sharpening, the grindstone, the tanning rack and the loom; craft experience is learned in dreams."
  - rscadd: "Ratwood and Azure Peak crafting recipes in the crafting menu, with skill checks."
  - rscadd: "NPC humans fight back; beasts graze, eat corpses, flee and lie in ambush."
  - qol: "Ratwood's default keybindings on the medieval HUD."
  - qol: "One alt intent is always picked (feint by default)."
  - qol: "Late join is open as soon as the round starts."
  - image: "Smoother animated Rockhill title screen."
  - admin: "Player quality (PQ) and triumph tools, the Rogue Player Panel, sending any player back to the lobby, sleeping and waking mobs."
  - bugfix: "Observers joining from the lobby no longer appear on the title screen."
  - bugfix: "The lobby title animation plays instead of staying on its first frame."
  - config: "New medieval settings in config/redtard/config.txt (treasury, taxes, food rot, cooking speed, sleep healing, craft experience, late join delay)."
  - code_imp: "All medieval content lives in modular_redtard with zero upstream edits; overrides are listed in OVERRIDES.md."